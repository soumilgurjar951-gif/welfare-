services:
  - type: web
    name: welfare-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && cd backend && python -c \"from app.db.base import Base; from app.db.session import engine; Base.metadata.create_all(bind=engine)\" && python seed.py"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
        value: "sqlite:///./scheme_sync.db"
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: "uploads"
      - key: SEED_ADMIN_EMAIL
        value: "admin@gov.in"
      - key: SEED_ADMIN_PASSWORD
        sync: false
        value: "Admin@123"
      - key: SEED_ADMIN_PHONE
        value: "9000000001"
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: welfare-frontend
    runtime: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://welfare--1.onrender.com"
      - key: NODE_ENV
        value: "production"
    autoDeploy: true
